name: LinYu

options:
  bundleIdPrefix: com.hualala
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

packages:
  LinYuCore:
    path: LinYuCore

schemes:
  LinYu:
    build:
      targets:
        LinYu: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

targets:
  LinYu:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: LinYu
        excludes:
          - "Info.plist"
    dependencies:
      - package: LinYuCore
    info:
      path: LinYu/Info.plist
      properties:
        CFBundleDisplayName: 淋浴
        CFBundleShortVersionString: "3.1.0"
        CFBundleVersion: "1"
        NSCameraUsageDescription: 用于扫描设备上的二维码，识别设备后即可开阀用水。
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hualala.linyu
        PRODUCT_NAME: LinYu
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
